<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Book</title>
    <style>
        .student-card {
            padding: 10px 20px;
            margin: 10px;
            border: 1px solid black;
            background-color: #f0f0f0;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<h1> Students</h1>
<input type="text" id="student-name" placeholder="Enter your name">
<button typr="button" id="Add-Student" onclick="AddStudent()">Add Students</button>
<button typr="button"  onclick="LoadStudent()">Load-Student</button>
    <div id="studentContainer"></div> <!-- Added missing div -->

    <script>
            function LoadStudent(){
        const students = ["Tejal", "Shravani", "Akangsha", "Abhi", "Nitin","Nidhi","Gauri"];
        const studentContainer = document.getElementById("studentContainer");

        studentContainer.innerHTML =" "

        if (studentContainer) {
            students.forEach((student, index) => {
                studentContainer.innerHTML += `<div class='student-card'>${index + 1}) ${student}</div>`;
            });
        }
    }
    function AddStudent(){
     const studentInput = document.getElementById("student-name")
     students.push(studentInput.value)
    }


    
    </script>

</body>
</html>
